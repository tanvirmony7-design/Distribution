name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Keystore restored successfully"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/DistroMaster-DMS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DistroMaster-DMS-APK
          path: output_apk/DistroMaster-DMS.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "DistroMaster DMS v1.0.0 (Official APK Download)"
          body: |
            ### 📱 DistroMaster DMS — Direct APK Download
            Click below to download the application:
            - **File**: `DistroMaster-DMS.apk`
            - **Platform**: Android 8.0+
          files: output_apk/DistroMaster-DMS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
