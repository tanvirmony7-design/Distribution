name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/DistroMaster-DMS.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DistroMaster-DMS-APK
          path: output_apk/DistroMaster-DMS.apk
          retention-days: 30

      - name: Publish GitHub Release (Instant 1-Click APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "DistroMaster DMS v1.0.0 (Direct APK Download)"
          body: |
            ## 📱 DistroMaster DMS — Android APK
            
            Welcome to the official release of **DistroMaster DMS (Distribution Management System)**!
            
            ### ⬇️ Download & Install
            Click on **`DistroMaster-DMS.apk`** below to download the application directly to your Android device.
            
            ### ✨ Features
            - **Bilingual Interface**: Seamless 1-tap English and Bengali (বাংলা) language switcher.
            - **Sales & Billing**: Create invoices, customer dues, discounts, live inventory stock deduction.
            - **Purchase & Suppliers**: Record incoming shipments, supplier ledger, and payable dues.
            - **Products & Inventory**: Barcode scanner, low stock warnings, buy/sell rates, profit margins.
            - **Route & Rep Tracking**: Assign sales representatives to delivery areas, call direct, vehicle registration.
            - **Delivery Status Pipeline**: Real-time progress (Order Taken ➔ Packed ➔ In Transit ➔ Delivered).
            - **Bluetooth Thermal Receipts**: 58mm/80mm receipt generation, digital sharing, and on-the-spot payment settlement.
            - **Offline-First Room Database**: Works offline without internet and syncs with cloud.
          files: output_apk/DistroMaster-DMS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
